name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK 27 and CMake 3.22.1
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build release APK (unsigned)
        working-directory: LSFG-Android-Application
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate unsigned APK
        id: apk
        run: |
          APK_PATH=$(find LSFG-Android-Application -path '*/release/*.apk' | grep -v '\.idsig' | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          TAG="${{ github.ref_name }}"
          echo "name=LLS-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Zipalign
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -rV | head -1)
          BUILD_TOOLS_DIR=$(dirname "$APKSIGNER")
          "$BUILD_TOOLS_DIR/zipalign" -f -v 4 "${{ steps.apk.outputs.path }}" lls-aligned.apk

      - name: Sign APK (testkey v1/v2/v3)
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -rV | head -1)
          "$APKSIGNER" sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${{ steps.apk.outputs.name }}" \
            lls-aligned.apk
          echo "Signed: ${{ steps.apk.outputs.name }} ($(du -sh "${{ steps.apk.outputs.name }}" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7

      - name: Determine release type
        id: rel
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-pre"* ]] || [[ "$TAG" == *"-beta"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: false
          fail_on_unmatched_files: true
